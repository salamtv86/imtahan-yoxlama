<title>Buraxılış imtahanı (10-cu sinif) — nəticələr</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#18202c;--muted:#5d6878;--line:#dde1e8;--acc:#1f5fd0;--acc-d:#174aa5;--warn-l:#fff3dc;--err-l:#fde8e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:22px 16px 44px}
.org{margin:4px 0 2px;font-size:15px;line-height:1.35;font-weight:600;color:var(--acc-d)}
h1{font-size:20px;line-height:1.3;margin:4px 0 6px}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
label{display:block;font-size:14px;color:var(--muted);margin:0 0 4px}
.fld{margin:0 0 12px}
input{width:100%;font:inherit;font-size:20px;padding:10px 12px;border:1px solid #c9cfd9;border-radius:10px;letter-spacing:.1em;background:#fff;color:var(--ink)}
input:focus{outline:2px solid #9cbcf3;border-color:var(--acc)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--acc);color:#fff;width:100%}
button:hover{background:var(--acc-d)}
button:disabled{opacity:.55;cursor:default}
button.alt{background:#fff;color:var(--ink);border:1px solid #c3cad6;margin-top:12px}
button.alt:hover{background:#f1f3f7}
.msg{margin:12px 0 0;padding:10px 12px;border-radius:10px;font-size:14.5px}
.msg.err{background:var(--err-l);color:#7a1f19;border:1px solid #efc2be}
.msg.warn{background:var(--warn-l);color:#6b3f00;border:1px solid #f0d9a8}
.who{color:var(--muted);font-size:14px;margin:0 0 2px;text-align:center}
.nm{font-size:19px;line-height:1.3;font-weight:700;margin:0 0 6px;text-align:center;overflow-wrap:anywhere}
.tot{text-align:center;padding:4px 0 14px;border-bottom:1px solid var(--line)}
.tot b{display:block;font-size:46px;line-height:1.1}
.tot span{color:var(--muted);font-size:14px}
.sj{display:flex;justify-content:space-between;gap:10px;padding:12px 0 2px;font-weight:600}
.sj em{font-style:normal;white-space:nowrap}
.pt{color:var(--muted);font-size:13.5px;padding:0 0 10px;border-bottom:1px solid var(--line)}
.pt:last-of-type{border-bottom:0}
.pt span{white-space:nowrap;margin-right:12px;display:inline-block}
.foot{color:var(--muted);font-size:13px;margin:0}
[hidden]{display:none!important}
</style>
</head>

  <div id="msg" role="alert" hidden></div>
</form>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var C = null;
  try { C = JSON.parse($('cfg').textContent); } catch (e) { }
  var msg = $('msg'), go = $('go'), res = $('res'), form = $('f');
  function showMsg(kind, text) { msg.className = 'msg ' + kind; msg.textContent = text; msg.hidden = false; }
  function hideMsg() { msg.hidden = true; msg.textContent = ''; }
  if (!C) { showMsg('err', 'Səhifənin məlumatı oxunmadı.'); go.disabled = true; return; }
  $('ttl').textContent = C.t || 'Nəticələr';
  document.title = C.t || 'Nəticələr';
  if (C.org) { $('org').textContent = C.org; $('org').hidden = false; }
  $('intro').textContent = 'Nəticənizi öyrənmək üçün cavab vərəqində boyadığınız 5 rəqəmli şagird nömrəsini' + (C.pin ? ' və müəllimin verdiyi 4 rəqəmli şəxsi kodu (PIN)' : '') + ' yazın.';
  if (C.pin) $('pinrow').hidden = false;
  var d = new Date(C.g || Date.now()), p2 = function (n) { return (n < 10 ? '0' : '') + n; };
  $('foot').textContent = 'Nəticələr ' + p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear() + ', ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ' tarixində yenilənib.' + (C.note ? ' ' + C.note : '');

  var enc = new TextEncoder(), dec = new TextDecoder();
  var subtle = window.crypto && window.crypto.subtle;
  if (!subtle) { showMsg('err', 'Bu brauzer şifrəli səhifəni aça bilmir. Səhifəni telefonun və ya kompüterin adi brauzerində (https ilə) açın.'); go.disabled = true; return; }
  function b64d(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function hex(u) { var s = ''; for (var i = 0; i < u.length; i++) s += (u[i] < 16 ? '0' : '') + u[i].toString(16); return s; }

  async function derive(secret) {

    var m = new Uint8Array(await subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(C.salt), iterations: C.it }, km, 256));

    var k = new Uint8Array(await subtle.digest('SHA-256', cat(enc.encode('key'), m)));
    return { tag: hex(t.subarray(0, 8)), key: k };
  }
  async function openRec(secret) {

      var pt = await subtle.decrypt({ name: 'AES-GCM', iv: b64d(rec[0]) }, key, b64d(rec[1]));
      return JSON.parse(dec.decode(pt));
    } catch (e) { return null; }
  }
  function num(x, one) {
    if (typeof x !== 'number' || !isFinite(x)) return '—';
    var v = one ? (Math.round(x * 10) / 10).toFixed(1) : String(Math.round(x * 100) / 100);
    return v.replace('.', ',');
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function render(r) {
    res.textContent = '';
    res.appendChild(el('p', 'who', 'Şagird № ' + (r.i || '')));         // r.i: şifrələnmiş sətirdəki nömrə
    if (r.n) res.appendChild(el('p', 'nm', r.n));                        // ad və soyad (və ya baş hərflər)
    var tot = el('div', 'tot');
    tot.appendChild(el('b', '', num(r.t, true)));
    tot.appendChild(el('span', '', 'cəmi bal (maksimum ' + num(r.m, false) + ')'));
    res.appendChild(tot);
    (r.s || []).forEach(function (s) {
      var row = el('div', 'sj');
      row.appendChild(el('span', '', s[0]));
      row.appendChild(el('em', '', num(s[1], true) + ' / ' + num(s[2], false)));
      res.appendChild(row);
      var parts = s[3] || [];
      if (parts.length) {
        var pt = el('div', 'pt');
        parts.forEach(function (q) { pt.appendChild(el('span', '', q[0] + ': ' + num(q[1], false))); });
        res.appendChild(pt);
      }
    });
    if (r.x) { var w = el('p', 'msg warn', 'Diqqət: açıq tapşırıqların (yazılı/esse) balı hələ tam daxil edilməyib, ona görə cəmi bal dəyişə bilər.'); res.appendChild(w); }
    var again = el('button', 'alt', 'Başqa nömrə yoxla');
    again.type = 'button';
    again.addEventListener('click', function () {
      res.hidden = true; res.textContent = ''; form.hidden = false;
      $('num').value = ''; if (C.pin) $('pin').value = '';
      $('num').focus();
    });
    res.appendChild(again);
    res.hidden = false;
    form.hidden = true;
    try { res.scrollIntoView({ block: 'start' }); } catch (e) { }
  }
  var fails = 0, lockUntil = 0, timer = null, busy = false;
  function tick() {
    var left = Math.ceil((lockUntil - Date.now()) / 1000);
    if (left > 0) { go.disabled = true; showMsg('warn', 'Çox sayda yanlış cəhd. ' + left + ' saniyə gözləyin.'); timer = setTimeout(tick, 500); }
    else { go.disabled = false; hideMsg(); }
  }
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (busy || Date.now() < lockUntil) return;
    hideMsg(); res.hidden = true;
    var id = ($('num').value || '').replace(/\D/g, '');
    if (!id || id.length > 5) { showMsg('err', '5 rəqəmli şagird nömrəsini yazın.'); return; }
    while (id.length < 5) id = '0' + id;
    var pin = '';
    if (C.pin) { pin = ($('pin').value || '').replace(/\D/g, ''); if (pin.length !== 4) { showMsg('err', '4 rəqəmli şəxsi kodu (PIN) yazın.'); return; } }
    busy = true; go.disabled = true; go.textContent = 'Yoxlanır…';
    var r = null, bad = false;
    try { r = await openRec(id + (C.pin ? ':' + pin : '')); } catch (err) { bad = true; }
    busy = false; go.textContent = 'Nəticəni göstər'; go.disabled = false;
    if (bad) { showMsg('err', 'Bu brauzer nəticəni aça bilmədi. Başqa brauzerlə yoxlayın.'); return; }
    if (!r) {
      fails++;
      showMsg('err', 'Bu məlumatlarla nəticə tapılmadı. Nömrəni' + (C.pin ? ' və kodu' : '') + ' yoxlayın. Nəticəniz hələ yüklənməyibsə, müəllimə müraciət edin.');
      if (fails >= 3) { lockUntil = Date.now() + Math.min(60, 5 * (fails - 2)) * 1000; tick(); }
      return;
    }
    fails = 0;
    if (!r.i) r.i = id;
    render(r);
  });
  $('num').addEventListener('input', function () { this.value = this.value.replace(/\D/g, ''); });
  $('pin').addEventListener('input', function () { this.value = this.value.replace(/\D/g, ''); });
})();
</script>
</body>
</html>
